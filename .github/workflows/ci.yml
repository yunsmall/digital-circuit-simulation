name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # 官方 riscv-tests 的 ELF 只在 Linux 上编一次，其它任务下载产物复用。
  # 测试代码在找不到目录时会 GTEST_SKIP，所以这一步必须存在，否则官方用例全被跳过。
  riscv-elfs:
    name: riscv-tests ELF
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # ELF 只取决于 riscv-tests 源码、构建脚本和编译器版本：把这些输入哈希进 key，
      # 命中就直接复用上次的产物（约 4 MB），不用重编。改了脚本或换 clang 大版本会自动失效
      - uses: actions/cache@v4
        id: elf-cache
        with:
          path: |
            tests/riscv-official/out
            tests/riscv-official/out64
          key: riscv-elfs-${{ runner.os }}-clang22-${{ hashFiles('tests/riscv-official/src/**', 'tests/riscv-official/env/**', 'tests/riscv-official/env_p/**', 'tests/riscv-official/build.sh', 'tests/riscv-official/fix_float16.py', 'tests/riscv-official/*.ld') }}

      # 链接器必须用 lld：宿主是 x86 时系统 ld 不认 riscv 目标。
      # 用 LLVM 22 编，和主构建的 clang 版本保持一致（Zicond/Zbkb 等新扩展需要较新的 LLVM）
      - name: Install LLVM 22
        if: steps.elf-cache.outputs.cache-hit != 'true'
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          sudo apt-get install -y -qq clang-22 lld-22
        shell: bash

      - name: Build official riscv-tests ELFs
        if: steps.elf-cache.outputs.cache-hit != 'true'
        run: CLANG=clang-22 JOBS=4 bash tests/riscv-official/build.sh
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: riscv-tests-elfs
          path: |
            tests/riscv-official/out
            tests/riscv-official/out64

  build:
    name: ${{ matrix.os }} / ${{ matrix.backend }}
    needs: riscv-elfs
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        backend: [llvm, tcc]

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      LLVM_VER: 22.1.7

    steps:
      - uses: actions/checkout@v4

      # 官方 riscv-tests 的 ELF（由 riscv-elfs 任务在 Linux 上编好）。
      # artifact 里是 out/ 和 out64/ 两个目录（upload 的公共前缀是 riscv-official），
      # 直接解到源码树的 riscv-official 下，CMake 设的 DCS_RISCV*_ELF_DIR 正好指向这里
      - uses: actions/download-artifact@v4
        with:
          name: riscv-tests-elfs
          path: tests/riscv-official

      # ============================================================
      # CMake >= 4.2（pip 安装，跨平台可靠）
      # ============================================================
      - name: Install CMake
        run: pip install "cmake>=4.2"
        shell: bash

      # ============================================================
      # vcpkg（nlohmann-json + cxxopts + gtest）
      # ============================================================
      - name: Setup vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"
          "$VCPKG_ROOT/vcpkg" install nlohmann-json cxxopts gtest elfio
        shell: bash

      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "${{ env.VCPKG_ROOT }}"
          "${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.bat"
          "${{ env.VCPKG_ROOT }}/vcpkg" install nlohmann-json cxxopts gtest elfio
        shell: cmd

      # ============================================================
      # LLVM/Clang 22.1.7
      # ============================================================
      - name: Install LLVM (Linux)
        if: runner.os == 'Linux' && matrix.backend == 'llvm'
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          sudo apt-get install -y clang-22 libclang-22-dev llvm-22-dev
          echo "LLVM_ROOT=/usr/lib/llvm-22" >> $GITHUB_ENV
        shell: bash

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'llvm'
        run: |
          LLVM_URL=https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.LLVM_VER }}/clang+llvm-${{ env.LLVM_VER }}-x86_64-pc-windows-msvc.tar.xz
          curl -L -o llvm.tar.xz "$LLVM_URL"
          7z x llvm.tar.xz -so | 7z x -si -ttar -o"C:/llvm" -y
          echo "LLVM_ROOT=C:/llvm/clang+llvm-${{ env.LLVM_VER }}-x86_64-pc-windows-msvc" >> $GITHUB_ENV
        shell: bash

      # ============================================================
      # TCC — 从 GitHub HEAD 编译
      # ============================================================
      - name: Build TCC (Linux)
        if: runner.os == 'Linux' && matrix.backend == 'tcc'
        run: |
          git clone https://github.com/TinyCC/tinycc.git /tmp/tinycc
          cd /tmp/tinycc && git checkout a338258d309c888bde96b2d1f206299231a54ddf
          ./configure --disable-static
          make -j$(nproc)
          sudo make install
        shell: bash

      - name: Build TCC (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'tcc'
        run: |
          git clone https://github.com/TinyCC/tinycc.git C:/tinycc
          cd /d C:/tinycc && git checkout a338258d309c888bde96b2d1f206299231a54ddf
          cd /d C:/tinycc/win32
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          .\build-tcc.bat -c cl -i
        shell: cmd

      # ============================================================
      # 配置 & 编译 & 测试
      # ============================================================
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq ninja-build
        shell: bash

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: pip install ninja
        shell: bash

      # Windows: 导出 MSVC 环境变量到 GITHUB_ENV，使后续 step 中 Ninja 能找到 cl.exe
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" > NUL
          echo PATH=%PATH%>> %GITHUB_ENV%
          echo INCLUDE=%INCLUDE%>> %GITHUB_ENV%
          echo LIB=%LIB%>> %GITHUB_ENV%
          echo LIBPATH=%LIBPATH%>> %GITHUB_ENV%
        shell: cmd

      - name: CMake configure
        run: |
          ARGS=(-B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DDCS_BUILD_VERILOG=OFF)
          if [ "${{ matrix.backend }}" = "tcc" ]; then
            ARGS+=(-DDCS_USE_TCC=ON)
            if [ "$RUNNER_OS" = "Windows" ] && [ -d "C:/tinycc/win32" ]; then ARGS+=(-DTCC_ROOT=C:/tinycc/win32); fi
          fi
          if [ -n "$LLVM_ROOT" ]; then ARGS+=(-DLLVM_ROOT="$LLVM_ROOT"); fi
          cmake "${ARGS[@]}"
        shell: bash

      - name: Build
        run: cmake --build build --parallel
        shell: bash

      - name: Test
        run: ctest --test-dir build --output-on-failure
        shell: bash

      - name: Install
        run: |
          cmake --install build --prefix "_artifact/dcs-${{ matrix.os }}-${{ matrix.backend }}"
          echo "=== 安装目录结构 ==="
          ls -R _artifact
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: dcs-${{ matrix.os }}-${{ matrix.backend }}
          path: _artifact